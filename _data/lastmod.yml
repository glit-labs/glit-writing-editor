# Last modification date of each core page, used for <lastmod> in sitemap.xml.
#
# The core pages (home, Store, Support, Privacy, Releases, Changelog) are built
# there from path strings rather than page objects, so there is no front matter
# to read a date from — hence this file. One entry per page: all eight language
# versions of a core page are always edited together, so they share a date.
#
# Keys match the `slugs` list in sitemap.xml ("@" is the home page).
#
# Update the line for a page whenever you change its content. A stale date is
# harmless, but a date that moves on every deploy is not: Google only uses
# <lastmod> when it is verifiably accurate, and build-time values teach it to
# ignore the field — including on the release notes, where the dates are real.
# A page with no entry here simply gets no <lastmod>.

"@": 2026-07-05
store.html: 2026-08-22
support.html: 2026-08-22
privacy.html: 2026-08-23
releases.html: 2026-08-22
CHANGELOG.html: 2026-08-22
