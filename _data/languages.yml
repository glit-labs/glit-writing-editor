# Languages shown in the top-right language selector.
# English is the default and lives at the site root (/); every other language
# has its own home page under `/<code>/`. Pages that aren't translated yet
# (Store, Support, Insights, Privacy, Releases) fall back to the English versions.
#
# `brand` is the descriptive "Glit: <descriptor>" string used as the <title>
# suffix for that language (see _includes/seo.html). It keeps terse page titles
# like "Store" / "商店" long enough that Bing doesn't flag them as too short,
# and mirrors each language's home-page title.
#
# `tagline` follows the brand in the home page's <title> only
# ("Glit: 웹소설 집필 에디터 — 집중해서 쓰고 독자처럼 확인하세요"). The brand alone is
# the App Store name and stays the on-page heading and share-card title, but
# at 15–30 characters it is too short a <title> for Bing.
#
# `twitter` is the X account whose handle goes in that language's card
# (`twitter:site`). Only the two languages with an official account set it;
# the rest omit it and fall back to site.twitter.username (@Glit_labs).
- code: en
  name: "English"
  url: /
  brand: "Glit: Web Novel Writing Editor"
  tagline: "Write Without Distraction"
  twitter: "Glit_labs"
