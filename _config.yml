# --- Site ---------------------------------------------------------------
# Short brand used for the masthead and the `... - Glit` title suffix.
title: "Glit"
description: "A focused writing tool for web novel creators"
url: "https://glit.app"
locale: "en-US"

# Default social-share image (Open Graph / X card) for every page. 1500x780 is
# ~1.92:1, matching the 1.91:1 both Facebook and X crop to, so it renders
# uncropped. Pages can override it with `header.og_image` in front matter.
og_image: /assets/images/glit-devices.png
og_image_width: 1500
og_image_height: 780

# Default X account for the card's `twitter:site`. The Japanese pages under
# /ja/ override this with their own account — see `twitter` in
# _data/languages.yml; every other language falls back to this one.
twitter:
  username: "Glit_labs"

# Official profiles, emitted as JSON-LD `sameAs` on the home pages. A card can
# name only one account, so this is where both are declared as Glit's own.
social:
  links:
    - "https://x.com/Glit_labs"
    - "https://x.com/Glit_labs_jp"

# Release-notes feed is a hand-rolled RSS 2.0 file at /rss.xml (Naver's RSS
# submission rejects Atom). Point the theme's <head> alternate link and the
# footer feed link at it instead of the removed /feed.xml.
atom_feed:
  path: "/rss.xml"

# --- Theme --------------------------------------------------------------
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
# Skins: default, air, aqua, contrast, dark, dirt, mint, neon, plum, sunrise
minimal_mistakes_skin: "default"

# --- Build --------------------------------------------------------------
markdown: kramdown

# Jekyll excludes dot-directories from the build by default. Force-include
# `.well-known` so files like microsoft-identity-association.json (Azure AD
# domain verification) are copied to _site and served by GitHub Pages.
include:
  - ".well-known"

# Promote each page's first `# Heading` to its page title and strip it from the
# body, so the theme renders a proper page header without a duplicate H1.
# (jekyll-titles-from-headings is enabled by default on GitHub Pages.)
titles_from_headings:
  strip_title: true
  collections: true

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings

# --- Analytics ----------------------------------------------------------
# Cloudflare Web Analytics, wired through the theme's `custom` provider hook,
# which renders _includes/analytics-providers/custom.html at the end of <body>.
# The theme guards that include with `jekyll.environment == 'production'`, so
# `jekyll serve` never reports local browsing as real traffic.
#
# Chosen over GA4 because it sets no cookies and stores nothing on the visitor's
# device, so no consent banner is required in the EEA/UK/CH and the site avoids
# the ePrivacy, TDDDG § 25 and LSSI-CE art. 22.2 consent machinery entirely.
# The token is public by design — it ships in the page source.
analytics:
  provider: "custom"
  cloudflare_token: "96f3f06a60c14931b5eab807d8f9b4bb"

# --- Author / footer ----------------------------------------------------
author:
  name: "Glit"
  bio: "A focused writing tool for web novel creators"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:kr.johng@gmail.com"

footer:
  links:
    - label: "Mac App Store"
      icon: "fab fa-fw fa-app-store"
      url: "https://apps.apple.com/us/app/glit-web-novel-writing-editor/id6764386721"
    - label: "Microsoft Store"
      icon: "fab fa-fw fa-microsoft"
      url: "https://apps.microsoft.com/detail/9n19p02fc7rf"

# --- Front matter defaults ---------------------------------------------
defaults:
  # All pages get the single (document) layout by default.
  - scope:
      path: ""
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false
  # No sticky table of contents anywhere. The theme parks the right sidebar
  # outside the page box (position: absolute; margin-right: -300px) and expects
  # a matching gutter on `.page`; the "uniform content width" override in
  # _includes/head/custom.html removes that gutter, so a TOC would hang off the
  # right edge and scroll the whole page sideways at window widths of roughly
  # 1024-1580px. Pages that need in-page jumps use the `.section-nav` pills
  # instead (see releases.md).
